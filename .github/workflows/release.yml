name: Release

on:
  push:
    tags: ["v*"]

# Only the job that publishes may write to the repository; the builds
# run third-party code (the crates) and need no more than to read it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            game: messoria.exe
            server: messoria-dedicated-server.exe
            archive: zip
          # Linux executables need the glibc they were built against or a
          # newer one: building on 22.04 (glibc 2.35) keeps Ubuntu 22.04,
          # Debian 12 and their peers able to play.
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            game: messoria
            server: messoria-dedicated-server
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.3
      - name: Build
        run: cargo build --release --locked -p messoria-game -p messoria-dedicated-server
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="messoria-${version}-${{ matrix.platform }}"
          mkdir -p "dist/${name}"
          cp "target/release/${{ matrix.game }}" "target/release/${{ matrix.server }}" "dist/${name}/"
          cp -r assets "dist/${name}/assets"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          cp assets/CREDITS.md "dist/${name}/CREDITS.md"
          # The game's dependency tree holds the server's, so its crates
          # cover both executables.
          cargo about generate --locked --fail -c about.toml \
            -m bins/game/Cargo.toml --target "${{ matrix.target }}" \
            -o "dist/${name}/THIRD-PARTY-LICENSES.txt" about.hbs
          cd dist
          archive="${name}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${archive}" "${name}" > /dev/null
          else
            tar -czf "${archive}" "${name}"
          fi
          sha256sum "${archive}" > "${archive}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { keep = 1; next }
            /^## \[/ { keep = 0 }
            keep { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      # A draft until the first release has been tried on Linux, which no
      # machine the game is made on runs.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
