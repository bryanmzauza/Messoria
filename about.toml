# The licenses of the crates the release executables are built from, gathered
# by `cargo about` into THIRD-PARTY-LICENSES.txt when a release is packed (see
# .github/workflows/release.yml). The accepted licenses are the ones deny.toml
# allows.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
# Only what ends up in the executables.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are not open source; LICENSE covers them.
private = { ignore = true }
