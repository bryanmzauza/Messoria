name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            game: messoria.exe
            server: messoria-dedicated-server.exe
          - os: ubuntu-latest
            platform: linux-x64
            game: messoria
            server: messoria-dedicated-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p messoria-game -p messoria-dedicated-server
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="messoria-${version}-${{ matrix.platform }}"
          mkdir -p "dist/${name}"
          cp "target/release/${{ matrix.game }}" "target/release/${{ matrix.server }}" "dist/${name}/"
          cp -r assets "dist/${name}/assets"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          cp assets/CREDITS.md "dist/${name}/CREDITS.md"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
          else
            zip -qr "${name}.zip" "${name}"
          fi
          sha256sum "${name}.zip" > "${name}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { keep = 1; next }
            /^## \[/ { keep = 0 }
            keep { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*.sha256
