[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Bryan Munaretto Zauza"]
license-file = "LICENSE"
repository = "https://github.com/bryanmzauza/Messoria"
publish = false

[workspace.dependencies]
messoria-client = { path = "crates/client" }
messoria-server = { path = "crates/server" }
messoria-shared = { path = "crates/shared" }

# Every crate opts into the Bevy features it needs; the server must stay free of
# rendering, windowing and audio.
bevy = { version = "0.19.1", default-features = false }
# Upgraded in lockstep with Bevy. Only `messoria-shared` enables transports and
# roles; see docs/adr/0002-networking-lightyear.md.
lightyear = { version = "0.30.1", default-features = false }

clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Bevy systems take `Res`, `Query` and `Commands` by value and routinely need
# many parameters with long types.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
