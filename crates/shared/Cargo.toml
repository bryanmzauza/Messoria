[package]
name = "messoria-shared"
description = "Protocol and simulation code shared by the Messoria client and server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log", "bevy_state"] }
lightyear = { workspace = true, features = [
  "std",
  "client",
  "server",
  "netcode",
  "udp",
  "replication",
  "prediction",
  "interpolation",
  "frame_interpolation",
  "input_native",
] }
messoria-calendar.workspace = true
messoria-content.workspace = true
messoria-inventory.workspace = true
messoria-voxel.workspace = true
serde.workspace = true

[lints]
workspace = true
