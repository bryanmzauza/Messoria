[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Bryan Munaretto Zauza"]
license-file = "LICENSE"
repository = "https://github.com/bryanmzauza/Messoria"
publish = false

[workspace.dependencies]
messoria-calendar = { path = "crates/calendar" }
messoria-client = { path = "crates/client" }
messoria-content = { path = "crates/content" }
messoria-farming = { path = "crates/farming" }
messoria-inventory = { path = "crates/inventory" }
messoria-server = { path = "crates/server" }
messoria-shared = { path = "crates/shared" }
messoria-voxel = { path = "crates/voxel" }

# Every crate opts into the Bevy features it needs; the server must stay free of
# rendering, windowing and audio.
bevy = { version = "0.19.1", default-features = false }
# Upgraded in lockstep with Bevy. Only `messoria-shared` enables transports and
# roles; see docs/adr/0002-networking-lightyear.md.
lightyear = { version = "0.30.1", default-features = false }

# Must match the version re-exported by Bevy, so math types cross between
# domain crates and the engine without conversion.
glam = { version = "0.32", features = ["serde"] }

clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
rand = "0.10"
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Bevy systems take `Res`, `Query` and `Commands` by value and routinely need
# many parameters with long types.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Meshing and collision queries are hot loops; keep them fast in debug builds.
[profile.dev.package.messoria-voxel]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
